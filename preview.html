<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Simulador Mobile | Rede Babilônia RPG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="assets/images/logo.jpg?v=3">
  <link rel="stylesheet" href="assets/css/variables.css?v=16">
  <link rel="stylesheet" href="assets/css/base.css?v=16">
  <style>
    body {
      background: #060708;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px 40px;
      color: #fff;
      font-family: var(--font-body);
    }

    .preview-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .preview-title {
      font-family: var(--font-heading);
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--green-neon);
      text-shadow: 0 0 16px var(--green-neon-glow);
      letter-spacing: 1px;
    }

    .preview-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      background: #0f1511;
      padding: 12px 18px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      margin-bottom: 24px;
      max-width: 900px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .control-select, .control-btn {
      background: #18221c;
      border: 1px solid var(--border-highlight);
      color: #fff;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-family: var(--font-heading);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      transition: all var(--transition-fast);
    }

    .control-select:hover, .control-btn:hover {
      border-color: var(--green-neon);
      color: var(--green-neon);
    }

    /* Moldura Realista de Celular */
    .phone-wrapper {
      position: relative;
      background: #151816;
      border: 10px solid #242c26;
      border-radius: 46px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(0, 255, 102, 0.15);
      overflow: hidden;
      transition: width 0.3s ease, height 0.3s ease;
    }

    /* Entalhe / Dynamic Island */
    .phone-notch {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 20px;
      background: #000;
      border-radius: 12px;
      z-index: 10;
      pointer-events: none;
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      border: none;
      background: #08090a;
      display: block;
    }

    .preview-tips {
      margin-top: 24px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      max-width: 600px;
      line-height: 1.5;
    }

    .preview-tips kbd {
      background: #1e2820;
      border: 1px solid var(--border-highlight);
      border-radius: 4px;
      padding: 2px 6px;
      color: var(--green-neon);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="preview-header">
    <h1 class="preview-title">SIMULADOR MOBILE & RESPONSIVIDADE</h1>
    <p style="color: var(--text-muted); font-size: 0.9rem;">Visualize o site exatamente como os jogadores veem no celular</p>
  </div>

  <div class="preview-controls">
    <div class="control-group">
      <span class="control-label">Aparelho:</span>
      <select id="device-select" class="control-select">
        <option value="393x852" selected>iPhone 15 / 16 (393 × 852)</option>
        <option value="360x800">Samsung Galaxy S / Android (360 × 800)</option>
        <option value="375x667">iPhone SE / Compacto (375 × 667)</option>
        <option value="412x915">Google Pixel / Telas Altas (412 × 915)</option>
        <option value="768x1024">Tablet / iPad (768 × 1024)</option>
      </select>
    </div>

    <div class="control-group">
      <span class="control-label">Página:</span>
      <select id="page-select" class="control-select">
        <option value="index.html" selected>Início (Landing Page)</option>
        <option value="servidores.html">Servidores Online</option>
        <option value="sistemas.html">Sistemas & Recursos</option>
        <option value="downloads.html">Downloads</option>
        <option value="loja.html">Loja & Moedas</option>
        <option value="regras.html">Regras Gerais</option>
        <option value="influenciadores.html">Influenciadores</option>
        <option value="faq.html">FAQ (Perguntas)</option>
        <option value="suporte.html">Suporte & Ouvidoria</option>
      </select>
    </div>

    <div class="control-group">
      <button id="btn-rotate" class="control-btn" title="Girar tela">&#x21bb; Girar</button>
      <button id="btn-open-real" class="control-btn" title="Abrir página pura em nova aba">&#x2197; Abrir Pura</button>
    </div>
  </div>

  <!-- Celular Virtual -->
  <div class="phone-wrapper" id="phone-container" style="width: 393px; height: 852px;">
    <div class="phone-notch"></div>
    <iframe id="phone-iframe" src="index.html" class="phone-screen"></iframe>
  </div>

  <div class="preview-tips">
    <p>Dica: Você também pode abrir a página diretamente e pressionar <kbd>F12</kbd> &rarr; <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>M</kbd> no seu navegador para testar qualquer tamanho livremente.</p>
  </div>

  <script>
    const deviceSelect = document.getElementById('device-select');
    const pageSelect = document.getElementById('page-select');
    const phoneContainer = document.getElementById('phone-container');
    const phoneIframe = document.getElementById('phone-iframe');
    const btnRotate = document.getElementById('btn-rotate');
    const btnOpenReal = document.getElementById('btn-open-real');

    let isLandscape = false;

    function updateDeviceSize() {
      const [w, h] = deviceSelect.value.split('x').map(Number);
      if (isLandscape) {
        phoneContainer.style.width = h + 'px';
        phoneContainer.style.height = w + 'px';
      } else {
        phoneContainer.style.width = w + 'px';
        phoneContainer.style.height = h + 'px';
      }
    }

    deviceSelect.addEventListener('change', updateDeviceSize);

    pageSelect.addEventListener('change', () => {
      phoneIframe.src = pageSelect.value;
    });

    btnRotate.addEventListener('click', () => {
      isLandscape = !isLandscape;
      updateDeviceSize();
    });

    btnOpenReal.addEventListener('click', () => {
      window.open(pageSelect.value, '_blank');
    });

    // Detectar navegações internas no iframe
    phoneIframe.addEventListener('load', () => {
      try {
        const currentPath = phoneIframe.contentWindow.location.pathname.split('/').pop();
        if (currentPath && pageSelect.value !== currentPath) {
          pageSelect.value = currentPath;
        }
      } catch (e) {}
    });
  </script>
</body>
</html>
